scoring_categories:
  rhythmic_spine:
    range: "0-10"
    intent: "Evaluates the foundational groove and structural timing."
  spatial_architecture:
    range: "0-10"
    intent: "Evaluates depth, width, frequency placement, and clarity."
  emotional_truth:
    range: "0-10"
    intent: "Evaluates raw emotive impact and authenticity."
  controlled_chaos:
    range: "0-10"
    intent: "Evaluates the balance between volatility and structural recovery."
  polished_indie_illusion:
    range: "0-10"
    intent: "Evaluates precise, crafted aesthetic that maintains an effortless feel."
  mythic_social_lyricism:
    range: "0-10"
    intent: "Evaluates meaning, poetic abstraction, and narrative grounding."
  healing_dance_transcendence:
    range: "0-10"
    intent: "Evaluates cathartic energy, uplift, and danceability."
  accessibility:
    range: "0-10"
    intent: "Evaluates how easily the listener can parse and connect with the material."
  restraint:
    range: "0-10"
    intent: "Evaluates the discipline to leave space and avoid over-production."
  identity_alignment:
    range: "0-10"
    intent: "Evaluates cohesion of artistic vision across all elements."
  structure_motion:
    range: "0-10"
    intent: "Evaluates forward momentum and arrangement pacing."

hard_flags:
  - too_generic
  - too_polished
  - too_cluttered
  - groove_collapses
  - no_memorable_arrival_point
  - lyrics_too_literal
  - lyrics_too_vague
  - chorus_not_earning_size
  - bridge_unjustified
  - arrangement_loses_center
  - too_much_reference_mimicry
  - dance_energy_without_healing
  - chaos_without_recovery
  - space_collapsed_by_density
  - emotion_overexplained
  - strong_parts_no_unified_identity
  - tool_specific_claim_without_evidence
  - execution_suggested_without_confirmation
  - hardware_routing_claim_without_receipt
